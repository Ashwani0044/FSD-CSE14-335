<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | ROAST & STRIKE</title>
    <style>
        :root {
            --bg-dark: #1b1411;
            --card-bg: #281e19;
            --accent-gold: #d4a373;
            --accent-cream: #faedcd;
            --text-main: #fefae0;
            --text-muted: #b09e90;
            --border-color: #3d2e24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        .navbar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 1.4rem; font-weight: 900; color: var(--accent-cream); text-decoration: none; }
        .logo span { color: var(--accent-gold); }
        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 600; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-gold); }

        .contact-container {
            max-width: 650px;
            margin: 4rem auto;
            width: 100%;
            padding: 2.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
        }

        .contact-container h1 { font-size: 2.2rem; color: var(--accent-cream); margin-bottom: 0.5rem; }
        .contact-container p { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; color: var(--accent-cream); font-size: 0.85rem; margin-bottom: 0.5rem; font-weight: 600; }
        .form-group input, .form-group textarea {
            width: 100%;
            background: #1b1411;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            color: var(--text-main);
            outline: none;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent-gold); }

        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, var(--accent-gold), #bc8a5f);
            color: #1b1411;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .footer { background-color: var(--card-bg); border-top: 1px solid var(--border-color); padding: 2rem; text-align: center; margin-top: auto; }
        .footer p { color: var(--text-muted); font-size: 0.85rem; }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">ROAST<span>&</span>STRIKE</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="product.html">Products</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </header>

    <div class="contact-container">
        <h1>GET IN TOUCH</h1>
        <p>Have questions about bat specifications, custom sizing, or bulk orders?</p>

        <form>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Your name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea rows="5" placeholder="Tell us what specs you need..." required></textarea>
            </div>
            <button type="submit" class="btn-submit">Send Message</button>
        </form>
    </div>

    <footer class="footer">
        <p>&copy; 2026 ROAST & STRIKE Co. All rights reserved.</p>
    </footer>

</body>
</html>
